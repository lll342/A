        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #1a0f0f;
            background-image: radial-gradient(#2c1818 1px, transparent 0);
            background-size: 24px 24px;
            color: #2c2c2c;
        }

        /* おみくじ筒の shaking アニメーション */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-8px, -5px) rotate(-12deg); }
            30% { transform: translate(8px, 0px) rotate(12deg); }
            45% { transform: translate(-8px, 5px) rotate(-8deg); }
            60% { transform: translate(8px, -2px) rotate(8deg); }
            75% { transform: translate(-4px, 0px) rotate(-4deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .animate-shake {
            animation: shake 1.2s ease-in-out infinite;
        }

        /* 和紙風背景テクスチャ効果 */
        .washi-bg {
            background-color: #fdfbf7;
            background-image: radial-gradient(#e8dfd1 0.5px, transparent 0.5px);
            background-size: 8px 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* 縦書き設定（タイトルや見出し用） */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* 和風の赤・金グラデーション */
        .btn-vermilion {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            border: 2px solid #fef08a;
        }
        .btn-vermilion:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        }

        /* 札が飛び出すアニメーション */
        @keyframes popUp {
            0% { transform: translateY(100px) scale(0.3); opacity: 0; }
            70% { transform: translateY(-20px) scale(1.05); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .animate-pop-up {
            animation: popUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

        // 音声効果（Web Audio APIで和太鼓風効果音を生成）
        function playDrumSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                // 音声再生がブロックされた場合は無視
            }
        }
